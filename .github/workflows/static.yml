  <h2>🚀 Giorno 10 – Migrazione & Infrastructure as Code <span class="tag">Domain 3</span></h2>

  <h3>Le 7 R della Migrazione Cloud</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Strategia</th><th>Nome</th><th>Descrizione</th><th>Effort</th></tr>
    <tr><td><strong>Retire</strong></td><td>Dismetti</td><td>Elimina applicazioni non più necessarie</td><td>–</td></tr>
    <tr><td><strong>Retain</strong></td><td>Mantieni</td><td>Lascia on-premises (compliance, non migra ora)</td><td>–</td></tr>
    <tr><td><strong>Rehost</strong></td><td>Lift &amp; Shift</td><td>Sposta VM as-is su EC2 senza modifiche</td><td>Basso</td></tr>
    <tr><td><strong>Replatform</strong></td><td>Lift, Tinker &amp; Shift</td><td>Piccole ottimizzazioni (es. DB su RDS invece di EC2)</td><td>Medio</td></tr>
    <tr><td><strong>Repurchase</strong></td><td>Drop &amp; Shop</td><td>Passa a SaaS (es. Salesforce invece di CRM custom)</td><td>Medio</td></tr>
    <tr><td><strong>Refactor / Re-architect</strong></td><td>Modernizza</td><td>Riprogetta come cloud-native, microservizi</td><td>Alto</td></tr>
    <tr><td><strong>Relocate</strong></td><td>Sposta a VMware Cloud</td><td>Migra VMware on-prem su VMware Cloud on AWS</td><td>Basso</td></tr>
  </table>
