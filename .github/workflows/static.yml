  <h3>Consolidated Billing</h3>
  <ul>
    <li>Un solo pagamento per tutti gli account dell'Organization</li>
    <li><strong>Volume discounts:</strong> I consumi di tutti gli account si sommano → soglie di sconto più basse</li>
    <li><strong>Free tiers:</strong> Si applicano per account, non a livello di Organization</li>
    <li>Il Management Account paga tutto. Può condividere Reserved Instances e Savings Plans tra account</li>
  </ul>

  <h3>Reserved Instance Marketplace</h3>
  <p>Permette di <strong>vendere Reserved Instances</strong> non più necessarie ad altri clienti AWS. Puoi acquistare RI di terze parti con sconti aggiuntivi e scadenze residue.</p>

  <h3>AWS Cost Allocation Tags</h3>
  <p>Tag applicati alle risorse AWS per tracciare i costi per progetto, team, ambiente:</p>
  <ul>
    <li><strong>AWS generated tags:</strong> es. <code>aws:createdBy</code></li>
    <li><strong>User-defined tags:</strong> es. <code>Project: Phoenix</code>, <code>Environment: Prod</code></li>
    <li>Attiva i tag nel Billing Console per vederli in Cost Explorer e CUR</li>
  </ul>

  <h3>AWS License Manager</h3>
  <p>Gestisce e traccia le licenze software (Microsoft, Oracle, SAP) su AWS e on-premises. Aiuta a rimanere conformi agli accordi di licenza ed evitare sanzioni.</p>

  <h3>AWS Personal Health Dashboard</h3>
  <p>Mostra lo stato di salute dei servizi AWS relativi al TUO account specifico (eventi pianificati, interruzioni che ti impattano). Diverso dal <strong>AWS Service Health Dashboard</strong> (stato globale di tutti i servizi AWS per tutti).</p>
  <div class="callout info"><strong>Differenza chiave:</strong> Service Health Dashboard = stato globale AWS (tutti). Personal Health Dashboard = impatto sul tuo account specifico.</div>

  <h3>AWS Well-Architected Tool</h3>
  <p>Strumento gratuito che valuta l'architettura AWS del tuo workload confrontandola con le best practice dei 6 pilastri del Well-Architected Framework. Genera report con rischi identificati e raccomandazioni.</p>

