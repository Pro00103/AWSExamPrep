  <h3>AWS Systems Manager (SSM)</h3>
  <p>Suite di strumenti per gestire e automatizzare l'infrastruttura AWS:</p>
  <ul>
    <li><strong>Session Manager:</strong> Shell browser su EC2 senza SSH/bastion host</li>
    <li><strong>Patch Manager:</strong> Patching automatizzato OS su flotte di istanze</li>
    <li><strong>Parameter Store:</strong> Archiviazione sicura di configurazioni e segreti</li>
    <li><strong>Run Command:</strong> Esegui comandi su flotte di EC2 senza SSH</li>
    <li><strong>Automation:</strong> Runbook automatizzati (es. restart istanze, backup)</li>
  </ul>

  <h3>AWS OpsWorks</h3>
  <p>Servizio di configuration management basato su <strong>Chef</strong> e <strong>Puppet</strong>. Gestisce configurazioni server, deployment, automazione. Utile per chi già usa Chef/Puppet on-premises e vuole portarlo su AWS.</p>
