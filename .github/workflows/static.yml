    explain: "CloudFormation è l'IaC nativa AWS: template JSON/YAML descrivono le risorse (Stack). Supporta rollback automatico, drift detection, change sets. CodeDeploy è per deploy applicazioni, non infrastruttura."
  },
  {
    domain: "Technology & Services", domainNum: 3,
    q: "Quale tipo di database AWS è progettato specificamente per workload di grafici come social network e rilevamento frodi?",
    multi: false,
    options: ["Amazon DynamoDB", "Amazon QLDB", "Amazon Neptune", "Amazon Timestream"],
    correct: [2],
    explain: "Neptune è il graph database di AWS, supporta Apache TinkerPop Gremlin e W3C SPARQL. Ideale per relazioni complesse (social graph, fraud detection, knowledge graph). QLDB è un ledger immutabile, Timestream è per time-series."
  },
  // Domain 4 – Billing & Support (2 questions)
  {
    domain: "Billing & Support", domainNum: 4,
    q: "Un'azienda vuole ricevere un avviso automatico quando la spesa mensile AWS supera $5000. Quale servizio configurare?",
    multi: false,
    options: ["AWS Cost Explorer", "AWS Trusted Advisor", "AWS Budgets", "AWS Pricing Calculator"],
    correct: [2],
    explain: "AWS Budgets permette di impostare soglie di spesa (per costo, utilizzo, RI coverage) e inviare alert via email/SNS quando vengono raggiunte. Cost Explorer analizza la spesa storica ma non invia alert automatici."
  },
  {
    domain: "Billing & Support", domainNum: 4,
    q: "Un'organizzazione ha acquistato Reserved Instances in un account ma vengono usate da un altro account nell'Organization. Come funziona la fatturazione?",
    multi: false,
    options: [
      "Lo sconto RI non si applica perché sono account diversi",
      "Con Consolidated Billing, lo sconto RI si applica automaticamente all'uso corrispondente in qualsiasi account dell'Organization",
      "È necessario trasferire manualmente le RI al secondo account",
      "Lo sconto si applica solo se entrambi gli account sono nella stessa OU"
    ],
    correct: [1],
    explain: "Consolidated Billing condivide automaticamente sconti RI e Savings Plans tra tutti gli account dell'Organization (se RI Sharing è abilitato, default). Questo massimizza l'utilizzo degli sconti. Una delle ragioni principali per usare Organizations."
  }
];

let examState = {
  currentQ: 0,
  answers: {},
  timerInterval: null,
  secondsLeft: 1800, // 30 minutes
  submitted: false
};

function startExam() {
  document.getElementById('exam-intro-div').style.display = 'none';
  document.getElementById('exam-running').style.display = 'block';
  examState = { currentQ: 0, answers: {}, timerInterval: null, secondsLeft: 1800, submitted: false };
  renderExamQ();
  examState.timerInterval = setInterval(examTick, 1000);
}

function examTick() {
  examState.secondsLeft--;
  const m = Math.floor(examState.secondsLeft / 60).toString().padStart(2,'0');
  const s = (examState.secondsLeft % 60).toString().padStart(2,'0');
  const timerEl = document.getElementById('exam-timer');
  timerEl.textContent = m + ':' + s;
  if (examState.secondsLeft <= 300) timerEl.classList.add('urgent');
  if (examState.secondsLeft <= 0) { clearInterval(examState.timerInterval); submitExam(); }
}

function renderExamQ() {
  const q = EXAM_QUESTIONS[examState.currentQ];
  const total = EXAM_QUESTIONS.length;
  const idx = examState.currentQ;

  document.getElementById('exam-q-label').textContent = `Domanda ${idx+1} di ${total}`;
  document.getElementById('exam-domain-label').textContent = `Domain ${q.domainNum} – ${q.domain}`;
  document.getElementById('exam-q-text').textContent = q.q;
  document.getElementById('exam-q-note').textContent = q.multi ? '(Seleziona 2 risposte)' : '(Seleziona 1 risposta)';
  document.getElementById('exam-prog-fill').style.width = ((idx+1)/total*100)+'%';

  const optDiv = document.getElementById('exam-options');
  optDiv.innerHTML = '';
  const saved = examState.answers[idx] || [];

  q.options.forEach((opt, oi) => {
    const div = document.createElement('div');
    div.className = 'exam-option' + (saved.includes(oi) ? ' selected' : '');
    div.setAttribute('data-idx', oi);
    div.innerHTML = `<span style="color:var(--accent);font-weight:700;min-width:20px">${String.fromCharCode(65+oi)}.</span> ${opt}`;
    div.onclick = () => selectExamOption(oi, q.multi);
    optDiv.appendChild(div);
  });

  document.getElementById('exam-prev-btn').style.display = idx === 0 ? 'none' : '';
  const isLast = idx === total - 1;
  document.getElementById('exam-next-btn').style.display = isLast ? 'none' : '';
  document.getElementById('exam-submit-btn').style.display = isLast ? '' : 'none';
}

function selectExamOption(oi, multi) {
  const idx = examState.currentQ;
  if (!examState.answers[idx]) examState.answers[idx] = [];
  if (multi) {
    const pos = examState.answers[idx].indexOf(oi);
    if (pos === -1) {
      if (examState.answers[idx].length < 2) examState.answers[idx].push(oi);
    } else {
      examState.answers[idx].splice(pos, 1);
    }
  } else {
    examState.answers[idx] = [oi];
  }
  // Re-render options
  const saved = examState.answers[idx];
  document.querySelectorAll('#exam-options .exam-option').forEach((div, i) => {
    div.classList.toggle('selected', saved.includes(i));
  });
}

function examNav(dir) {
  const next = examState.currentQ + dir;
  if (next >= 0 && next < EXAM_QUESTIONS.length) {
    examState.currentQ = next;
    renderExamQ();
  }
}

function submitExam() {
  if (examState.submitted) return;
  examState.submitted = true;
  clearInterval(examState.timerInterval);
  document.getElementById('exam-running').style.display = 'none';
  document.getElementById('exam-results').style.display = 'block';

  // Calculate score
  let total = 0;
  let domainScores = {1:{correct:0,total:0}, 2:{correct:0,total:0}, 3:{correct:0,total:0}, 4:{correct:0,total:0}};
  EXAM_QUESTIONS.forEach((q, i) => {
    const dn = q.domainNum;
    domainScores[dn].total++;
    const ans = (examState.answers[i] || []).sort();
    const correct = [...q.correct].sort();
    const isCorrect = JSON.stringify(ans) === JSON.stringify(correct);
    if (isCorrect) { total++; domainScores[dn].correct++; }
  });

  const pct = Math.round(total / EXAM_QUESTIONS.length * 100);
  const pass = pct >= 70;

  document.getElementById('result-score-display').textContent = `${total}/20`;
  document.getElementById('result-score-display').className = 'result-score ' + (pass ? 'pass' : 'fail');
  document.getElementById('result-pct-display').textContent = `${pct}%`;
  const badge = document.getElementById('result-badge');
  badge.textContent = pass ? '✅ SUPERATO' : '❌ NON SUPERATO';
  badge.className = 'result-badge ' + (pass ? 'pass' : 'fail');

  // Domain breakdown
  const domNames = {1:'Cloud Concepts',2:'Security',3:'Technology',4:'Billing'};
  const breakEl = document.getElementById('result-breakdown');
  breakEl.innerHTML = '';
  [1,2,3,4].forEach(dn => {
    const ds = domainScores[dn];
    const dp = Math.round(ds.correct/ds.total*100);
    breakEl.innerHTML += `<div class="domain-score-card">
      <h4>${domNames[dn]}</h4>
      <div class="score">${ds.correct}/${ds.total}</div>
      <div style="color:var(--text2);font-size:0.75rem">${dp}%</div>
    </div>`;
  });

  // Detailed review
  const revEl = document.getElementById('exam-review-detail');
  revEl.innerHTML = '<h3 style="margin-bottom:16px;color:var(--text)">📋 Revisione Dettagliata</h3>';
  EXAM_QUESTIONS.forEach((q, i) => {
    const ans = (examState.answers[i] || []).sort();
    const correct = [...q.correct].sort();
    const isCorrect = JSON.stringify(ans) === JSON.stringify(correct);
    const correctText = q.correct.map(ci => `${String.fromCharCode(65+ci)}. ${q.options[ci]}`).join('; ');
    const yourText = ans.length > 0 ? ans.map(ci => `${String.fromCharCode(65+ci)}. ${q.options[ci]}`).join('; ') : 'Non risposto';
    revEl.innerHTML += `<div class="review-item">
      <div class="r-q">${i+1}. ${q.q}</div>
      ${isCorrect ? '<div class="r-correct">✅ Risposta corretta</div>' : `
        <div class="r-yours">❌ La tua risposta: ${yourText}</div>
        <div class="r-correct">✅ Risposta esatta: ${correctText}</div>
      `}
      <div class="r-explain">💡 ${q.explain}</div>
    </div>`;
  });

  // Save to localStorage
  const quizScores = JSON.parse(localStorage.getItem('aws_quiz_scores') || '{}');
  quizScores['mock_exam'] = pct / 100;
  localStorage.setItem('aws_quiz_scores', JSON.stringify(quizScores));
  updateQuizAvg();
}

function retakeExam() {
  examState = { currentQ: 0, answers: {}, timerInterval: null, secondsLeft: 1800, submitted: false };
  document.getElementById('exam-results').style.display = 'none';
  document.getElementById('exam-running').style.display = 'none';
  document.getElementById('exam-intro-div').style.display = 'block';
  document.getElementById('exam-timer').textContent = '30:00';
  document.getElementById('exam-timer').classList.remove('urgent');
}
</script>
<script>
// ===== SCROLL PROGRESS & BACK TO TOP =====
window.addEventListener('scroll', () => {
  const scrollTop = document.documentElement.scrollTop;
  const scrollHeight = document.documentElement.scrollHeight - document.documentElement.clientHeight;
  const pct = scrollHeight > 0 ? (scrollTop / scrollHeight) * 100 : 0;
  document.getElementById('scroll-progress').style.width = pct + '%';

  // Back to top
  const btn = document.getElementById('back-to-top');
  btn.classList.toggle('visible', scrollTop > 400);

  // Sidebar active link
  updateActiveSidebarLink();
});

// ===== SIDEBAR ACTIVE HIGHLIGHT =====
const sectionIds = ['dashboard-section','struttura','giorno1','giorno2','giorno3','giorno4',
  'giorno5','giorno6','giorno7','giorno8','giorno9','giorno10',
  'keyword-section','quiz-section','flashcard-section','mock-exam'];

function updateActiveSidebarLink() {
  const headerH = 80;
  let active = null;
  for (const id of sectionIds) {
    const el = document.getElementById(id);
    if (el) {
      const rect = el.getBoundingClientRect();
      if (rect.top <= headerH + 40) active = id;
    }
  }
  document.querySelectorAll('.sidebar .nav-link').forEach(link => {
    link.classList.remove('active');
  });
  if (active) {
    const mapping = {
      'giorno1': 'g1','giorno2':'g2','giorno3':'g3','giorno4':'g4',
      'giorno5': 'g5','giorno6':'g6','giorno7':'g7','giorno8':'g8',
      'giorno9': 'g9','giorno10':'g10'
    };
    document.querySelectorAll('.sidebar .nav-link').forEach(link => {
      const section = link.getAttribute('data-section');
      if (section && mapping[active] === section) link.classList.add('active');
    });
  }
}

// ===== SCROLL TO SECTION =====
function scrollTo(id) {
  const el = document.getElementById(id);
  if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// ===== THEME TOGGLE =====
function toggleTheme() {
  const current = document.documentElement.getAttribute('data-theme');
  const next = current === 'light' ? 'dark' : 'light';
  document.documentElement.setAttribute('data-theme', next === 'dark' ? '' : 'light');
  localStorage.setItem('aws_theme', next);
  document.querySelector('.theme-toggle').textContent = next === 'light' ? '🌙 Tema' : '☀️ Tema';
}

// ===== SECTION CHECKBOXES =====
function toggleCheck(event, sectionId) {
  event.stopPropagation();
  const checks = JSON.parse(localStorage.getItem('aws_checks') || '{}');
  checks[sectionId] = !checks[sectionId];
  localStorage.setItem('aws_checks', JSON.stringify(checks));
  applyChecks();
  updateDashboard();
}

function applyChecks() {
  const checks = JSON.parse(localStorage.getItem('aws_checks') || '{}');
  const sections = ['g1','g2','g3','g4','g5','g6','g7','g8','g9','g10'];
  sections.forEach(id => {
    const el = document.getElementById('chk-' + id);
    if (el) {
      if (checks[id]) { el.textContent = '✓'; el.classList.add('done'); }
      else { el.textContent = ''; el.classList.remove('done'); }
    }
  });
}

// ===== DASHBOARD UPDATE =====
function updateDashboard() {
  const checks = JSON.parse(localStorage.getItem('aws_checks') || '{}');
  const sections = ['g1','g2','g3','g4','g5','g6','g7','g8','g9','g10'];
  const doneCount = sections.filter(s => checks[s]).length;
  document.getElementById('dash-days').textContent = doneCount;
  document.getElementById('hdr-days').textContent = doneCount;

  // SVG circle for days (out of 10)
  const dayOffset = 201 - (201 * doneCount / 10);
  document.getElementById('circ-days').style.strokeDashoffset = dayOffset;

  // Topics %
  const topicPct = Math.round(doneCount / 10 * 100);
  document.getElementById('dash-topics').textContent = topicPct;
  document.getElementById('circ-topics').style.strokeDashoffset = 201 - (201 * topicPct / 100);

  // Quiz avg
  updateQuizAvg();

  // Flashcard pct
  const fcPct = parseInt(localStorage.getItem('aws_fc_pct') || '0');
  document.getElementById('dash-fc').textContent = fcPct;
  document.getElementById('circ-fc').style.strokeDashoffset = 201 - (201 * fcPct / 100);
}

// ===== SIDEBAR SEARCH =====
function filterSidebar(val) {
  const v = val.toLowerCase();
  document.querySelectorAll('.sidebar .nav-link').forEach(link => {
    const txt = link.textContent.toLowerCase();
    link.style.display = (v === '' || txt.includes(v)) ? '' : 'none';
  });
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  // Restore theme
  const savedTheme = localStorage.getItem('aws_theme');
  if (savedTheme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    document.querySelector('.theme-toggle').textContent = '☀️ Tema';
  }

  // Restore checks
  applyChecks();

  // Init dashboard
  updateDashboard();

  // Init flashcards
  fcReset();

  // SVG circle baseline
  document.querySelectorAll('.svg-circle .fill').forEach(el => {
    el.style.strokeDashoffset = 201;
  });

  // Keyboard support for flashcard
  document.addEventListener('keydown', (e) => {
    const stage = document.querySelector('.fc-stage');
    if (!stage) return;
    if (e.key === ' ' || e.key === 'Enter') fcFlip();
    if (e.key === 'ArrowRight') fcAction('know');
    if (e.key === 'ArrowLeft') fcAction('review');
  });
});
</script>
</body>
</html>
