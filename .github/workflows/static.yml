  <h2>💰 Giorno 8 – Billing, Costi & Support <span class="tag">Domain 4</span></h2>

  <h3>Modelli di Pricing AWS</h3>
  <ul>
    <li><strong>Pay-as-you-go:</strong> Paghi esattamente ciò che usi, quando lo usi</li>
    <li><strong>Pay less when you reserve:</strong> Impegno 1-3 anni = sconti fino al 72%</li>
    <li><strong>Pay less with more use:</strong> Sconti volume su S3, Data Transfer</li>
    <li><strong>Free Tier:</strong> 12 mesi gratuiti per servizi nuovi + always-free (Lambda 1M req/mese)</li>
  </ul>

  <h3>Strumenti di Cost Management</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Strumento</th><th>Funzione</th><th>Quando usarlo</th></tr>
    <tr><td><strong>AWS Pricing Calculator</strong></td><td>Stima costi PRIMA del deploy</td><td>Planning, proposte commerciali, budget preventivo</td></tr>
    <tr><td><strong>AWS Cost Explorer</strong></td><td>Analizza costi storici e futuri (grafici)</td><td>Identificare trend di spesa, anomalie</td></tr>
    <tr><td><strong>AWS Budgets</strong></td><td>Alert quando superi soglie di spesa</td><td>Notifiche email/SNS al 80%, 100% del budget</td></tr>
    <tr><td><strong>Cost & Usage Report (CUR)</strong></td><td>Report granulare CSV su S3 (ogni ora)</td><td>Analisi avanzata, chargeback, FinOps</td></tr>
    <tr><td><strong>Cost Anomaly Detection</strong></td><td>ML che rileva spike di costo inattesi</td><td>Alert automatici per spese anomale</td></tr>
    <tr><td><strong>AWS Compute Optimizer</strong></td><td>Raccomandazioni right-sizing EC2/Lambda/EBS</td><td>Ridurre over-provisioning, ottimizzare spesa compute</td></tr>
  </table>
  </div>

  <h3>AWS Support Plans</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Piano</th><th>Costo</th><th>TAM</th><th>Resp. Critica</th><th>Trusted Advisor</th></tr>
