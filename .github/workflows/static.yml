    <tr><td><strong>Site-to-Site VPN</strong></td><td>Tunnel IPsec cifrato su internet</td><td>Fino a 1.25 Gbps</td><td>Variabile</td><td>Basso</td><td>Connessione rapida on-prem ↔ AWS</td></tr>
    <tr><td><strong>AWS Direct Connect</strong></td><td>Linea dedicata fisica (1-100 Gbps)</td><td>Fino a 100 Gbps</td><td>Costante, bassa</td><td>Alto</td><td>Alta banda, latenza deterministica</td></tr>
    <tr><td><strong>AWS PrivateLink</strong></td><td>Connessione privata VPC ↔ servizi</td><td>–</td><td>Bassa</td><td>Medio</td><td>Esporre servizi senza internet</td></tr>
    <tr><td><strong>VPC Peering</strong></td><td>Connessione diretta VPC ↔ VPC</td><td>–</td><td>Bassa</td><td>Trasferimento dati</td><td>2 VPC collegati direttamente</td></tr>
    <tr><td><strong>Transit Gateway</strong></td><td>Hub centrale per molti VPC/VPN</td><td>50 Gbps/attachment</td><td>Bassa</td><td>Per attachment</td><td>Reti hub-and-spoke, centralizzazione</td></tr>
  </table>
  </div>
  <div class="callout info"><strong>VPC Peering vs Transit Gateway:</strong> Peering = 1-to-1 (non transitivo). Transit Gateway = hub centrale che connette N VPC/VPN/DX in modo transitivo.</div>

  <h3>Amazon Route 53 – DNS Gestito</h3>
  <p>Route 53 è il servizio DNS globale di AWS. Gestisce registrazione domini, DNS routing e health checks.</p>
  <div class="table-wrap">
  <table>
    <tr><th>Routing Policy</th><th>Logica</th><th>Caso d'uso</th></tr>
    <tr><td><strong>Simple</strong></td><td>Ritorna sempre lo stesso record</td><td>Un solo endpoint</td></tr>
    <tr><td><strong>Weighted</strong></td><td>Distribuisce % traffico tra record</td><td>A/B testing, canary deploy 90/10</td></tr>
    <tr><td><strong>Latency</strong></td><td>Risponde con la Regione a latenza minore</td><td>App multi-regione</td></tr>
    <tr><td><strong>Failover</strong></td><td>Primary → Secondary se primary fallisce</td><td>Disaster Recovery attivo/passivo</td></tr>
    <tr><td><strong>Geolocation</strong></td><td>Routing basato su posizione geografica utente</td><td>Contenuti localizzati, compliance GDPR</td></tr>
    <tr><td><strong>Multi-Value</strong></td><td>Ritorna multipli IP sani (con health check)</td><td>Load balancing DNS-level base</td></tr>
  </table>
  </div>
  <div class="callout warn"><strong>Trap esame:</strong> Route 53 è un servizio GLOBALE (non regionale). Il record Alias è AWS-specific e può puntare ad ALB, CloudFront, S3 website, API Gateway — GRATIS (a differenza di CNAME).</div>

  <h3>AWS Global Accelerator</h3>
  <p>Migliora la disponibilità e performance delle applicazioni globali usando la rete backbone privata AWS (non l'internet pubblico).</p>
  <ul>
    <li>Fornisce <strong>2 IP anycast statici</strong> globali come punto di ingresso fisso</li>
    <li>Il traffico entra nella rete AWS all'Edge Location più vicina e viaggia sulla backbone AWS</li>
    <li>Supporta EC2, ALB, NLB, Elastic IP come endpoint</li>
    <li>Health checks automatici: failover in &lt;30 secondi se endpoint non sano</li>
  </ul>
  <div class="callout info"><strong>Global Accelerator vs CloudFront:</strong> CloudFront = CDN (cache contenuti statici/dinamici). Global Accelerator = accelera traffico TCP/UDP non-HTTP (gaming, IoT, VoIP) o app che richiedono IP fissi.</div>

  <h3>Disaster Recovery – 4 Strategie</h3>
  <p><strong>RPO (Recovery Point Objective)</strong> = quanti dati si può perdere (es. backup ogni 1h = RPO max 1h).<br>
  <strong>RTO (Recovery Time Objective)</strong> = quanto tempo per tornare operativi dopo un disastro.</p>
  <div class="table-wrap">
  <table>
    <tr><th>Strategia DR</th><th>RPO</th><th>RTO</th><th>Costo</th><th>Descrizione</th></tr>
    <tr><td><strong>Backup &amp; Restore</strong></td><td>Alto (ore)</td><td>Alto (ore)</td><td>💲</td><td>Backup su S3/Glacier. Ripristino quando serve. Economico ma lento.</td></tr>
    <tr><td><strong>Pilot Light</strong></td><td>Medio</td><td>Medio (minuti)</td><td>💲💲</td><td>Core minimo sempre attivo (es. DB replicato). Scale-out rapido in caso DR.</td></tr>
    <tr><td><strong>Warm Standby</strong></td><td>Basso</td><td>Basso (minuti)</td><td>💲💲💲</td><td>Versione ridotta dell'ambiente sempre running. Scale-up in caso DR.</td></tr>
    <tr><td><strong>Multi-Site / Hot Standby</strong></td><td>Minimo</td><td>Minimo (secondi)</td><td>💲💲💲💲</td><td>Due ambienti full-scale in parallelo. Failover istantaneo. Costo più alto.</td></tr>
  </table>
  </div>
  <div class="callout success"><strong>Mnemonico:</strong> Backup→Pilot→Warm→Hot: costo sale, RPO/RTO scendono. Più spendi, prima recuperi.</div>
</div>

