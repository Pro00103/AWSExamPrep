  <h3>Infrastructure as Code (IaC)</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Servizio</th><th>Linguaggio</th><th>Livello</th><th>Descrizione</th></tr>
    <tr><td><strong>AWS CloudFormation</strong></td><td>JSON / YAML</td><td>Dichiarativo</td><td>IaC nativa AWS. Template = Stack. Rollback automatico</td></tr>
    <tr><td><strong>AWS CDK</strong></td><td>Python, TypeScript, Java...</td><td>Imperativo → CF</td><td>Codice si compila in template CloudFormation</td></tr>
