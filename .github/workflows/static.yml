let fcDeck = [...FLASHCARDS];
let fcIndex = 0;
let fcKnown = new Set();
let fcReview = new Set();

function fcShuffle() {
  fcDeck = [...FLASHCARDS].sort(() => Math.random() - 0.5);
  fcIndex = 0; fcKnown.clear(); fcReview.clear();
  document.getElementById('fc-card').classList.remove('flipped');
  fcRender();
}
function fcReset() {
  fcDeck = [...FLASHCARDS]; fcIndex = 0; fcKnown.clear(); fcReview.clear();
  document.getElementById('fc-card').classList.remove('flipped');
  fcRender();
}
function fcFlip() {
  document.getElementById('fc-card').classList.toggle('flipped');
}
function fcAction(type) {
  if (type === 'know') fcKnown.add(fcIndex);
  else fcReview.add(fcIndex);
  document.getElementById('fc-card').classList.remove('flipped');
  const next = fcIndex + 1;
  if (next < fcDeck.length) { fcIndex = next; fcRender(); }
  else {
    document.getElementById('fc-question').textContent = '🎉 Hai completato tutte le carte!';
    document.getElementById('fc-answer').textContent = `${fcKnown.size} conosciute, ${fcReview.size} da ripassare`;
    document.getElementById('fc-detail').textContent = 'Clicca Ricomincia per rifare il mazzo';
    const total = fcDeck.length;
    const pct = Math.round((fcKnown.size / total) * 100);
    localStorage.setItem('aws_fc_pct', pct);
    updateDashboard();
  }
  const prog = ((fcIndex + 1) / fcDeck.length) * 100;
  document.getElementById('fc-prog').style.width = prog + '%';
  const known = fcKnown.size, review = fcReview.size;
  document.getElementById('fc-stats').textContent = `✅ ${known} conosciute · 🔄 ${review} da ripassare`;
}
function fcRender() {
  const card = fcDeck[fcIndex];
  document.getElementById('fc-domain').textContent = card.d;
  document.getElementById('fc-question').textContent = card.q;
  document.getElementById('fc-answer').textContent = card.a;
  document.getElementById('fc-detail').textContent = card.detail;
  document.getElementById('fc-counter').textContent = `Carta ${fcIndex + 1} di ${fcDeck.length}`;
  document.getElementById('fc-prog').style.width = ((fcIndex + 1) / fcDeck.length * 100) + '%';
}

// ===== QUIZ HELPERS =====
function checkQuiz(name, correct, itemId) {
  const radios = document.querySelectorAll(`input[name="${name}"]`);
  let selected = null;
  radios.forEach(r => { if (r.checked) selected = r.value; });
  if (!selected) { alert('Seleziona una risposta!'); return; }
  radios.forEach(r => {
    const lbl = r.closest('label');
    if (r.value === correct) lbl.classList.add('correct');
    else if (r.value === selected && selected !== correct) lbl.classList.add('incorrect');
    r.disabled = true;
  });
  const expEl = document.getElementById('exp-' + name);
  if (expEl) expEl.classList.add('show');
  // save quiz scores
  const scores = JSON.parse(localStorage.getItem('aws_quiz_scores') || '{}');
  scores[name] = selected === correct ? 1 : 0;
  localStorage.setItem('aws_quiz_scores', JSON.stringify(scores));
  updateQuizAvg();
}

function updateQuizAvg() {
  const scores = JSON.parse(localStorage.getItem('aws_quiz_scores') || '{}');
  const vals = Object.values(scores);
  if (vals.length === 0) return;
  const avg = Math.round((vals.reduce((a,b)=>a+b,0)/vals.length)*100);
  document.getElementById('hdr-quiz').textContent = avg + '%';
  document.getElementById('dash-quiz').textContent = avg + '%';
  const offset = 201 - (201 * avg / 100);
  document.getElementById('circ-quiz').style.strokeDashoffset = offset;
}

// ===== KEYWORD FILTER =====
function filterKeywords(val) {
  const rows = document.querySelectorAll('#kw-body .kw-row');
  const v = val.toLowerCase();
  rows.forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(v) ? '' : 'none';
  });
}
