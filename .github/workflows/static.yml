<!-- GIORNO 1 -->
<div class="section" id="giorno1">
  <h2>☁️ Giorno 1 – Fondamenti del Cloud <span class="tag">Domain 1</span></h2>

  <h3>Cos'è il Cloud Computing?</h3>
  <p>Il cloud computing è la fornitura on-demand di risorse IT (compute, storage, database, networking, software) tramite internet con pagamento a consumo (<strong>pay-as-you-go</strong>).</p>

  <h3>I 6 Vantaggi del Cloud (AWS)</h3>
  <ul>
    <li><strong>Trade fixed expense for variable expense</strong> – Paghi solo ciò che usi</li>
    <li><strong>Benefit from massive economies of scale</strong> – AWS aggrega milioni di clienti</li>
    <li><strong>Stop guessing capacity</strong> – Scala su/giù in base alla domanda</li>
    <li><strong>Increase speed and agility</strong> – Risorse pronte in minuti</li>
    <li><strong>Stop spending money running data centers</strong> – Focus sul business, non sull'infrastruttura</li>
    <li><strong>Go global in minutes</strong> – Deploy in più Regioni con pochi click</li>
  </ul>

  <h3>I 3 Modelli di Servizio Cloud</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Modello</th><th>Descrizione</th><th>Esempio AWS</th><th>Responsabilità Cliente</th></tr>
    <tr><td><strong>IaaS</strong></td><td>Infrastruttura come servizio – hardware virtualizzato</td><td>EC2, VPC, EBS</td><td>OS, middleware, app, dati</td></tr>
    <tr><td><strong>PaaS</strong></td><td>Piattaforma come servizio – ambiente di sviluppo gestito</td><td>Elastic Beanstalk, RDS</td><td>Solo app e dati</td></tr>
    <tr><td><strong>SaaS</strong></td><td>Software come servizio – app complete nel cloud</td><td>Amazon WorkMail, Chime</td><td>Solo utilizzo</td></tr>
  </table>
  </div>

  <h3>I 3 Modelli di Deployment Cloud</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Modello</th><th>Descrizione</th><th>Caso d'uso</th></tr>
    <tr><td><strong>Public Cloud</strong></td><td>Tutto nel cloud AWS. Nessun hardware on-premises.</td><td>Startup, nuove app cloud-native</td></tr>
    <tr><td><strong>Private Cloud</strong></td><td>Cloud dedicato, on-premises (es. VMware, OpenStack)</td><td>Settore bancario, governo, compliance stretta</td></tr>
    <tr><td><strong>Hybrid Cloud</strong></td><td>Combinazione di on-premises + cloud pubblico</td><td>Migrazione graduale, dati sensibili on-prem</td></tr>
  </table>
  </div>
  <div class="callout warn"><strong>Nota esame:</strong> AWS Outposts è la soluzione AWS per portare l'infrastruttura AWS fisica nel tuo data center (hybrid/private).</div>

  <h3>Infrastruttura Globale AWS</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Concetto</th><th>Descrizione</th><th>Dettaglio</th></tr>
    <tr><td><strong>Region</strong></td><td>Area geografica con ≥2 AZ</td><td>~33 Regioni attive. Scelta: latenza, compliance, costo, servizi disponibili</td></tr>
    <tr><td><strong>Availability Zone (AZ)</strong></td><td>1+ data center fisicamente separati</td><td>Connessi con fibra privata ridondante. Isolati per fault tolerance</td></tr>
    <tr><td><strong>Edge Location</strong></td><td>Nodo CloudFront/Route53</td><td>>400 POP globali. Cache contenuti vicino agli utenti</td></tr>
    <tr><td><strong>Local Zone</strong></td><td>Estensione di Regione in area metropolitana</td><td>Latenza ultra-bassa per città specifiche (es. Los Angeles)</td></tr>
    <tr><td><strong>Wavelength Zone</strong></td><td>Deploy AWS nelle reti 5G dei carrier</td><td>Latenza &lt;10ms per app mobile/IoT</td></tr>
    <tr><td><strong>AWS Outposts</strong></td><td>Rack AWS fisici nel tuo data center</td><td>Stessa API AWS on-premises. Ideale per compliance dati locali</td></tr>
  </table>
  </div>

  <h3>Modello di Responsabilità Condivisa</h3>
  <div class="table-wrap">
  <table>
    <tr><th>AWS Responsabile ("Security OF the Cloud")</th><th>Cliente Responsabile ("Security IN the Cloud")</th></tr>
    <tr><td>Hardware fisico, data center, rete globale</td><td>Dati dei clienti</td></tr>
    <tr><td>Hypervisor, virtualizzazione</td><td>Configurazione OS (patch, updates)</td></tr>
    <tr><td>Software dei servizi gestiti (es. RDS OS)</td><td>Networking (Security Groups, NACL)</td></tr>
    <tr><td>Infrastruttura globale (Regioni, AZ, Edge)</td><td>Gestione identità (IAM, MFA)</td></tr>
    <tr><td>Software fondamentale (compute, storage, DB)</td><td>Crittografia lato client e server</td></tr>
  </table>
  </div>
  <div class="callout success"><strong>Mnemonico:</strong> AWS protegge il palazzo (hardware, infrastruttura). Tu sei responsabile di quello che metti dentro (dati, OS, configurazioni).</div>
</div>
<!-- GIORNO 2 -->
<div class="section" id="giorno2">
  <h2>🌐 Giorno 2 – Infrastruttura Globale <span class="tag">Domain 1 & 3</span></h2>

  <h3>Come Scegliere una Regione AWS?</h3>
  <ul>
    <li><strong>Compliance & Data Residency:</strong> Leggi locali (es. GDPR impone dati in EU)</li>
    <li><strong>Latenza:</strong> Scegli la Regione più vicina ai tuoi utenti</li>
    <li><strong>Disponibilità dei Servizi:</strong> Non tutti i servizi AWS sono in tutte le Regioni</li>
    <li><strong>Costi:</strong> I prezzi variano tra Regioni (us-east-1 spesso più economica)</li>
  </ul>

  <h3>Servizi Globali vs Regionali</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Scope</th><th>Servizi</th><th>Note</th></tr>
    <tr><td><strong>Globale</strong></td><td>IAM, Route 53, CloudFront, WAF</td><td>Non legati a una Regione specifica</td></tr>
    <tr><td><strong>Regionale</strong></td><td>EC2, S3, RDS, Lambda, VPC</td><td>Le risorse esistono in una Regione</td></tr>
    <tr><td><strong>Zonal</strong></td><td>EC2 instances, EBS volumes</td><td>Legate a una specifica AZ</td></tr>
  </table>
  </div>
  <div class="callout info"><strong>Nota:</strong> S3 è regionale ma i bucket hanno nomi globalmente unici. I dati restano nella Regione scelta salvo replica esplicita.</div>

  <h3>AWS Well-Architected Framework – 6 Pilastri</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Pilastro</th><th>Focus</th><th>Principio chiave</th></tr>
    <tr><td><strong>Operational Excellence</strong></td><td>Eseguire e monitorare sistemi</td><td>Infrastructure as Code, runbook, automazione</td></tr>
    <tr><td><strong>Security</strong></td><td>Proteggere dati e sistemi</td><td>Least privilege, crittografia, MFA</td></tr>
    <tr><td><strong>Reliability</strong></td><td>Resilienza ai guasti</td><td>Multi-AZ, backup, auto-healing</td></tr>
    <tr><td><strong>Performance Efficiency</strong></td><td>Uso efficiente delle risorse</td><td>Serverless, right-sizing, benchmark</td></tr>
    <tr><td><strong>Cost Optimization</strong></td><td>Eliminare sprechi</td><td>Reserved Instances, spot, auto-scaling</td></tr>
    <tr><td><strong>Sustainability</strong></td><td>Impatto ambientale</td><td>Ridurre carbon footprint, ottimizzare utilizzo</td></tr>
  </table>
  </div>

  <h3>AWS Cloud Adoption Framework (CAF)</h3>
  <p>Framework che aiuta le organizzazioni a pianificare la migrazione al cloud attraverso <strong>6 prospettive</strong>:</p>
  <ul>
    <li><strong>Business:</strong> Allineare IT agli obiettivi aziendali</li>
    <li><strong>People:</strong> Training, change management, cultura</li>
    <li><strong>Governance:</strong> Gestione rischi, compliance, KPI</li>
    <li><strong>Platform:</strong> Architettura target, ambienti cloud</li>
    <li><strong>Security:</strong> Controlli di sicurezza, IAM, risposta agli incidenti</li>
    <li><strong>Operations:</strong> Monitoraggio, service management, automazione</li>
  </ul>
</div>

<!-- GIORNO 3 -->
<div class="section" id="giorno3">
  <h2>🔐 Giorno 3 – IAM & Identity <span class="tag">Domain 2</span></h2>

  <h3>AWS IAM – Concetti Fondamentali</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Entità IAM</th><th>Descrizione</th><th>Caso d'uso</th></tr>
    <tr><td><strong>Root User</strong></td><td>Account owner, accesso totale illimitato</td><td>Solo per task iniziali. Non usare quotidianamente!</td></tr>
    <tr><td><strong>IAM User</strong></td><td>Persona o applicazione con credenziali fisse</td><td>Sviluppatori, admin con accesso console/CLI</td></tr>
    <tr><td><strong>IAM Group</strong></td><td>Collezione di Users con stesse policy</td><td>Gruppo "Developers" con policy S3/EC2</td></tr>
    <tr><td><strong>IAM Role</strong></td><td>Identità temporanea assumibile da servizi/utenti</td><td>EC2 che accede a S3, Lambda che scrive su DynamoDB</td></tr>
    <tr><td><strong>IAM Policy</strong></td><td>Documento JSON che definisce permessi</td><td>Allegata a User/Group/Role</td></tr>
  </table>
  </div>

  <h3>Root User – 12 Cose Solo il Root Può Fare</h3>
  <div class="callout danger"><strong>Best practice:</strong> Crea subito un IAM User admin, abilita MFA sul root, poi non usarlo più!</div>
  <ul>
    <li>Chiudere l'account AWS</li>
    <li>Cambiare piano Support</li>
    <li>Restaurare permessi IAM admin</li>
    <li>Configurare S3 bucket con MFA Delete</li>
    <li>Attivare/disattivare MFA sull'account root</li>
    <li>Modificare le impostazioni dell'account (nome, email, password)</li>
    <li>Visualizzare alcune tax invoices</li>
    <li>Registrarsi come venditore nel Marketplace</li>
    <li>Configurare CloudFront key pairs</li>
    <li>Creare un AWS GovCloud account</li>
    <li>Abilitare IAM access to Billing console</li>
    <li>Submit reverse DNS per EC2</li>
  </ul>

  <h3>MFA – Multi-Factor Authentication</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Tipo MFA</th><th>Descrizione</th><th>Esempio</th></tr>
    <tr><td><strong>Virtual MFA</strong></td><td>App su smartphone genera TOTP</td><td>Google Authenticator, Authy, AWS MFA app</td></tr>
    <tr><td><strong>Hardware TOTP token</strong></td><td>Dispositivo fisico genera codici temporali</td><td>Gemalto, YubiKey (modalità OTP)</td></tr>
    <tr><td><strong>FIDO Security Key (U2F)</strong></td><td>Chiave USB fisica, standard FIDO2/WebAuthn</td><td>YubiKey, eWBM, SurePassID</td></tr>
  </table>
  </div>

  <h3>AWS Organizations</h3>
  <p>Servizio per gestire <strong>più account AWS</strong> centralmente.</p>
  <div class="table-wrap">
  <table>
    <tr><th>Componente</th><th>Descrizione</th></tr>
    <tr><td><strong>Management Account (Root)</strong></td><td>Account principale che crea l'Organization. Paga tutto.</td></tr>
    <tr><td><strong>Organizational Unit (OU)</strong></td><td>Contenitore logico per raggruppare account (es. OU-Prod, OU-Dev)</td></tr>
    <tr><td><strong>Member Account</strong></td><td>Account figlio all'interno dell'Organization</td></tr>
    <tr><td><strong>Service Control Policy (SCP)</strong></td><td>Policy che definisce il MAX dei permessi consentiti per OU/account. NON concede permessi da sola.</td></tr>
  </table>
  </div>
  <div class="callout info"><strong>Vantaggi:</strong> Consolidated Billing (una sola fattura), sconti volume aggregati, SCP per governance centralizzata.</div>

  <h3>AWS IAM Identity Center (ex SSO)</h3>
  <p>Soluzione di <strong>Single Sign-On</strong> per accedere a più account AWS e applicazioni business con un unico set di credenziali.</p>
  <ul>
    <li>Si integra con Active Directory, Okta, Azure AD</li>
    <li>Assegna Permission Sets (es. PowerUserAccess) agli utenti</li>
    <li>Accesso centralizzato tramite AWS Access Portal</li>
    <li>Ideale per organizzazioni con decine/centinaia di account</li>
  </ul>

  <h3>Principio del Minimo Privilegio (Least Privilege)</h3>
  <p>Concedi solo i permessi strettamente necessari per eseguire il lavoro. Inizia con zero permessi e aggiungi solo quelli necessari.</p>
  <div class="callout success"><strong>Pratica:</strong> Usa AWS Access Analyzer per identificare risorse con accesso eccessivo. Usa IAM Access Advisor per vedere gli ultimi accessi e rimuovere permessi inutilizzati.</div>
</div>
<!-- GIORNO 4 -->
<div class="section" id="giorno4">
  <h2>🛡️ Giorno 4 – Sicurezza & Compliance <span class="tag">Domain 2</span></h2>

  <h3>Protezione da DDoS – Shield & WAF</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Servizio</th><th>Livello</th><th>Cosa Protegge</th><th>Costo</th></tr>
    <tr><td><strong>AWS Shield Standard</strong></td><td>L3/L4</td><td>Tutti i clienti AWS automaticamente. Protegge da SYN floods, UDP floods</td><td>Incluso</td></tr>
    <tr><td><strong>AWS Shield Advanced</strong></td><td>L3/L4/L7</td><td>EC2, ELB, CloudFront, Route53, Global Accelerator. DDoS Response Team 24/7</td><td>$3000/mese</td></tr>
    <tr><td><strong>AWS WAF</strong></td><td>L7</td><td>CloudFront, ALB, API Gateway. Blocca SQL injection, XSS, bot, IP malevoli</td><td>Pay-per-use</td></tr>
    <tr><td><strong>Network Firewall</strong></td><td>L3-L7</td><td>VPC-level. Stateful/stateless rules, IPS/IDS capabilities</td><td>Pay-per-use</td></tr>
  </table>
  </div>

  <h3>Servizi di Security Monitoring</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Servizio</th><th>Funzione</th><th>Input</th></tr>
    <tr><td><strong>Amazon GuardDuty</strong></td><td>Threat detection ML-based. Rileva attività anomale</td><td>CloudTrail, VPC Flow Logs, DNS Logs</td></tr>
    <tr><td><strong>AWS Security Hub</strong></td><td>Dashboard centralizzata security findings</td><td>GuardDuty, Inspector, Macie, Config</td></tr>
    <tr><td><strong>Amazon Inspector</strong></td><td>Vulnerability scanning automatico su EC2/Container/Lambda</td><td>CVE database, network reachability</td></tr>
    <tr><td><strong>Amazon Macie</strong></td><td>Scopre e protegge dati sensibili (PII) in S3</td><td>S3 bucket contents, ML classification</td></tr>
    <tr><td><strong>Amazon Detective</strong></td><td>Indagine forense sicurezza, graph analysis</td><td>GuardDuty findings, CloudTrail, VPC Flow Logs</td></tr>
    <tr><td><strong>AWS CloudTrail</strong></td><td>Audit trail di TUTTE le chiamate API AWS</td><td>Console, CLI, SDK, servizi AWS</td></tr>
    <tr><td><strong>AWS Config</strong></td><td>Traccia configurazione risorse nel tempo, compliance rules</td><td>Resource config changes</td></tr>
  </table>
  </div>

  <h3>AWS Trusted Advisor – 5 Categorie</h3>
  <p>Strumento che analizza il tuo account AWS e fornisce raccomandazioni in 5 categorie:</p>
  <ul>
    <li>🔴 <strong>Cost Optimization:</strong> Risorse sottoutilizzate, Reserved Instances non usate</li>
    <li>🟡 <strong>Performance:</strong> EC2 sovraccarichi, CloudFront senza compressione</li>
    <li>🔴 <strong>Security:</strong> MFA non abilitata sul root, Security Groups aperti</li>
    <li>🟡 <strong>Fault Tolerance:</strong> RDS senza Multi-AZ, S3 senza versionamento</li>
    <li>🔵 <strong>Service Limits:</strong> Avviso quando si avvicina ai limiti di servizio</li>
  </ul>
  <div class="callout warn"><strong>Piano gratuito:</strong> Solo 7 check base (security + service limits). Business/Enterprise Support: tutti i check + notifiche automatiche.</div>

  <h3>AWS Control Tower</h3>
  <p>Configura e governa un ambiente multi-account AWS in modo sicuro e conforme. Si basa su AWS Organizations e offre:</p>
  <ul>
    <li><strong>Landing Zone:</strong> Ambiente multi-account ben architettato (pronto in ore)</li>
    <li><strong>Guardrails:</strong> Policy preventive (SCP) e detective (Config Rules) pre-configurate</li>
    <li><strong>Account Factory:</strong> Provisioning automatizzato di nuovi account con baseline</li>
    <li><strong>Dashboard:</strong> Visibilità centralizzata sulla conformità di tutti gli account</li>
  </ul>

  <h3>Crittografia in AWS</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Servizio</th><th>Funzione</th><th>Tipo</th></tr>
    <tr><td><strong>AWS KMS</strong></td><td>Gestione chiavi di crittografia (CMK)</td><td>Simmetrica, Asimmetrica. Integrato con S3, EBS, RDS...</td></tr>
    <tr><td><strong>AWS CloudHSM</strong></td><td>Hardware Security Module dedicato (FIPS 140-2 L3)</td><td>Chiavi esclusivamente sotto il tuo controllo</td></tr>
    <tr><td><strong>AWS Certificate Manager</strong></td><td>Provisioning, gestione, rinnovo cert SSL/TLS</td><td>Gratuito per ACM-integrated services</td></tr>
    <tr><td><strong>AWS Secrets Manager</strong></td><td>Archivia e ruota automaticamente segreti (DB password, API key)</td><td>Rotation automatica ogni X giorni</td></tr>
  </table>
  </div>

  <h3>Conformità e Programmi di Compliance</h3>
  <ul>
    <li><strong>AWS Artifact:</strong> Portale self-service per report di compliance (SOC 1/2/3, PCI DSS, ISO 27001, HIPAA)</li>
    <li><strong>AWS Audit Manager:</strong> Raccolta automatica prove per audit continuo</li>
    <li><strong>Programmi:</strong> PCI DSS, HIPAA/HITECH, SOC, ISO, FedRAMP, GDPR</li>
  </ul>
</div>

<!-- GIORNO 5 -->
<div class="section" id="giorno5">
  <h2>💻 Giorno 5 – Compute & Storage <span class="tag">Domain 3</span></h2>

  <h3>Amazon EC2 – Tipi di Istanze</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Famiglia</th><th>Ottimizzata per</th><th>Esempi</th><th>Caso d'uso</th></tr>
    <tr><td><code>t3, t4g</code></td><td>Burstable General Purpose</td><td>t3.micro, t3.medium</td><td>Web server, dev/test, piccoli DB</td></tr>
    <tr><td><code>m6i, m7g</code></td><td>General Purpose bilanciata</td><td>m6i.large</td><td>App server, backend</td></tr>
    <tr><td><code>c6i, c7g</code></td><td>Compute-optimized</td><td>c6i.4xlarge</td><td>HPC, ML inference, gaming server</td></tr>
    <tr><td><code>r6i, r7g</code></td><td>Memory-optimized</td><td>r6i.xlarge</td><td>Database in-memory, SAP, Spark</td></tr>
