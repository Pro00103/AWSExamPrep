    <li><strong>Desired capacity:</strong> Numero target normale</li>
    <li><strong>Maximum capacity:</strong> Limite massimo scalabile</li>
    <li><strong>Scaling policies:</strong> Target Tracking (CPU al 70%), Step Scaling, Scheduled</li>
