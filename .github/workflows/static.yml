<div class="section" id="giorno9">
  <h2>📝 Giorno 9 – Ripasso Finale <span class="tag">Review</span></h2>
  <p>Usa questa sezione per consolidare i concetti chiave prima dell'esame. Rivedi le flashcard, fai il quiz trappola e il mock exam completo.</p>
  <h3>Checklist Pre-Esame</h3>
  <ul>
    <li>✅ Conosco i 4 domini e le loro percentuali (24/30/34/12)</li>
    <li>✅ So distinguere Modello Condiviso AWS (OF) vs Cliente (IN)</li>
    <li>✅ IAM: User vs Group vs Role vs Policy – differenze chiare</li>
    <li>✅ Multi-AZ = failover HA, Read Replica = performance lettura</li>
    <li>✅ Security Group = stateful, NACL = stateless</li>
    <li>✅ S3 classi: Standard → IA → Glacier → Deep Archive (costo↓, retrieval↑)</li>
    <li>✅ Spot = 90% sconto ma interrompibile, Reserved = 72% con impegno</li>
    <li>✅ CloudTrail = AUDIT API calls, Config = COMPLIANCE resource state</li>
    <li>✅ Shield Standard = gratis+auto, Advanced = $3000/mese+DRT</li>
    <li>✅ Support: Business = TAM pool + 1h critical, Enterprise = TAM dedicato + 15min</li>
    <li>✅ Route 53: Simple/Weighted/Latency/Failover/Geo/MultiValue routing policies</li>
    <li>✅ DR: Backup→Pilot Light→Warm Standby→Multi-Site (costo↑, RTO/RPO↓)</li>
    <li>✅ S3 versioning + Object Lock (WORM) + presigned URL + Block Public Access</li>
    <li>✅ CloudWatch: Metrics, Logs, Alarms, Dashboards — RAM NON monitorata senza agent</li>
    <li>✅ Elastic Beanstalk = PaaS gratis (paghi solo le risorse), Lambda = FaaS event-driven</li>
    <li>✅ Athena = SQL serverless su S3, Glue = ETL serverless, QuickSight = BI dashboard</li>
    <li>✅ Global Accelerator = 2 IP anycast statici, backbone AWS, TCP/UDP</li>
    <li>✅ Personal Health Dashboard = il tuo account, Service Health Dashboard = tutti</li>
  </ul>
</div>

