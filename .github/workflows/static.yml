<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS Cloud Practitioner CLF-C02 – Studio Completo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ===== CSS VARIABLES ===== */
:root {
  --bg: #0f172a;
  --bg2: #1e293b;
  --bg3: #334155;
  --border: #334155;
  --text: #e2e8f0;
  --text2: #94a3b8;
  --accent: #ff9900;
  --accent2: #ffb84d;
  --blue: #38bdf8;
  --green: #4ade80;
  --red: #f87171;
  --purple: #c084fc;
  --yellow: #fbbf24;
  --sidebar-w: 280px;
  --header-h: 64px;
  --radius: 12px;
  --shadow: 0 4px 24px rgba(0,0,0,0.4);
  --transition: 0.2s ease;
}
[data-theme="light"] {
  --bg: #f8fafc;
  --bg2: #ffffff;
  --bg3: #e2e8f0;
  --border: #cbd5e1;
  --text: #0f172a;
  --text2: #475569;
  --shadow: 0 4px 24px rgba(0,0,0,0.1);
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  overflow-x: hidden;
}
/* ===== SCROLL PROGRESS BAR ===== */
#scroll-progress {
  position: fixed; top: 0; left: 0; height: 3px; width: 0%;
  background: linear-gradient(90deg, var(--accent), var(--blue));
  z-index: 1000; transition: width 0.1s linear;
}
/* ===== HEADER ===== */
header {
  position: sticky; top: 0; height: var(--header-h);
  background: var(--bg2); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
  padding: 0 24px; z-index: 500; box-shadow: var(--shadow);
}
.header-logo { display: flex; align-items: center; gap: 10px; }
.header-logo .logo-icon {
  width: 36px; height: 36px; background: var(--accent);
  border-radius: 8px; display: flex; align-items: center; justify-content: center;
  font-weight: 700; color: #000; font-size: 14px;
}
.header-logo h1 { font-size: 1rem; font-weight: 600; color: var(--text); }
.header-logo span { font-size: 0.75rem; color: var(--text2); display: block; }
.header-right { display: flex; align-items: center; gap: 12px; }
.pill {
  background: var(--bg3); border-radius: 20px; padding: 4px 12px;
  font-size: 0.75rem; color: var(--text2); border: 1px solid var(--border);
}
.pill strong { color: var(--accent); }
.theme-toggle {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 8px;
  padding: 6px 12px; cursor: pointer; color: var(--text); font-size: 0.85rem;
  transition: var(--transition);
}
.theme-toggle:hover { background: var(--accent); color: #000; }
/* ===== LAYOUT ===== */
.layout { display: flex; min-height: calc(100vh - var(--header-h)); }
/* ===== SIDEBAR ===== */
.sidebar {
  width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
  position: sticky; top: var(--header-h); height: calc(100vh - var(--header-h));
  overflow-y: auto; padding: 16px; flex-shrink: 0;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
.sidebar-search {
  width: 100%; padding: 8px 12px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.85rem; margin-bottom: 16px;
  outline: none; transition: var(--transition);
}
.sidebar-search:focus { border-color: var(--accent); }
.sidebar-section { margin-bottom: 8px; }
.sidebar-section h4 {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--text2); margin-bottom: 6px; padding: 0 4px;
}
.sidebar .nav-link {
  display: flex; align-items: center; gap: 8px; padding: 7px 10px;
  border-radius: 8px; color: var(--text2); font-size: 0.82rem;
  text-decoration: none; cursor: pointer; transition: var(--transition);
  border: none; background: none; width: 100%; text-align: left;
}
.sidebar .nav-link:hover { background: var(--bg3); color: var(--text); }
.sidebar .nav-link.active { background: rgba(255,153,0,0.15); color: var(--accent); font-weight: 600; }
.sidebar .nav-link .check {
  width: 16px; height: 16px; border: 1.5px solid var(--border); border-radius: 4px;
  flex-shrink: 0; display: flex; align-items: center; justify-content: center;
  font-size: 10px; cursor: pointer; transition: var(--transition);
}
.sidebar .nav-link .check.done { background: var(--green); border-color: var(--green); color: #000; }
.sidebar .nav-link .eta { margin-left: auto; font-size: 0.7rem; color: var(--text2); white-space: nowrap; }
/* ===== MAIN CONTENT ===== */
main {
  flex: 1; padding: 32px 40px; max-width: calc(100% - var(--sidebar-w));
  overflow-x: hidden;
}
/* ===== PROGRESS DASHBOARD ===== */
.dashboard {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px; margin-bottom: 40px;
}
.dash-card {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 20px; display: flex; flex-direction: column; align-items: center; gap: 12px;
}
.dash-card h3 { font-size: 0.8rem; color: var(--text2); text-align: center; }
.dash-card .value { font-size: 1.6rem; font-weight: 700; color: var(--accent); }
.svg-circle { width: 80px; height: 80px; }
.svg-circle circle { fill: none; stroke-width: 8; stroke-linecap: round; }
.svg-circle .track { stroke: var(--bg3); }
.svg-circle .fill { stroke: var(--accent); stroke-dasharray: 201; stroke-dashoffset: 201; transition: stroke-dashoffset 1s ease; transform: rotate(-90deg); transform-origin: center; }
/* ===== SECTION CARDS ===== */
.section {
  background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 32px; margin-bottom: 28px; scroll-margin-top: calc(var(--header-h) + 16px);
}
.section h2 {
  font-size: 1.3rem; font-weight: 700; color: var(--text); margin-bottom: 16px;
  display: flex; align-items: center; gap: 10px;
}
.section h2 .tag {
  font-size: 0.65rem; background: rgba(255,153,0,0.2); color: var(--accent);
  border-radius: 4px; padding: 2px 8px; font-weight: 600; text-transform: uppercase;
}
.section h3 { font-size: 1rem; font-weight: 600; color: var(--accent); margin: 20px 0 8px; }
.section h4 { font-size: 0.9rem; font-weight: 600; color: var(--blue); margin: 14px 0 6px; }
.section p { color: var(--text2); margin-bottom: 10px; font-size: 0.92rem; }
.section ul, .section ol { padding-left: 20px; color: var(--text2); font-size: 0.92rem; }
.section li { margin-bottom: 6px; }
.section li strong { color: var(--text); }
/* ===== TABLES ===== */
.table-wrap { overflow-x: auto; margin: 16px 0; border-radius: 8px; }
table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
th {
  background: var(--bg3); color: var(--text); font-weight: 600;
  padding: 10px 14px; text-align: left; border-bottom: 2px solid var(--border);
}
td {
  padding: 9px 14px; border-bottom: 1px solid var(--border); color: var(--text2);
  vertical-align: top;
}
tr:hover td { background: rgba(255,255,255,0.02); }
td strong { color: var(--accent); }
td code {
  background: var(--bg3); padding: 2px 6px; border-radius: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; color: var(--blue);
}
/* ===== DOMAIN PILLS ===== */
.domain-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px;
  margin: 16px 0;
}
.domain-card {
  background: var(--bg3); border-radius: 10px; padding: 16px;
  border-left: 4px solid var(--accent);
}
.domain-card.blue { border-left-color: var(--blue); }
.domain-card.green { border-left-color: var(--green); }
.domain-card.purple { border-left-color: var(--purple); }
.domain-card h4 { font-size: 0.85rem; color: var(--text); margin-bottom: 4px; }
.domain-card .pct { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
.domain-card.blue .pct { color: var(--blue); }
.domain-card.green .pct { color: var(--green); }
.domain-card.purple .pct { color: var(--purple); }
/* ===== CALLOUT BOXES ===== */
.callout {
  border-radius: 8px; padding: 14px 16px; margin: 12px 0;
  font-size: 0.88rem; border-left: 4px solid;
}
.callout.info { background: rgba(56,189,248,0.1); border-color: var(--blue); color: var(--text2); }
.callout.warn { background: rgba(251,191,36,0.1); border-color: var(--yellow); color: var(--text2); }
.callout.success { background: rgba(74,222,128,0.1); border-color: var(--green); color: var(--text2); }
.callout.danger { background: rgba(248,113,113,0.1); border-color: var(--red); color: var(--text2); }
.callout strong { color: var(--text); }
/* ===== KEYWORD TABLE ===== */
.kw-search {
  width: 100%; padding: 10px 14px; background: var(--bg3); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 0.9rem; margin-bottom: 16px; outline: none;
}
.kw-search:focus { border-color: var(--accent); }
.kw-row td:first-child { color: var(--yellow); font-style: italic; }
.kw-row td:last-child { color: var(--green); font-weight: 600; }
/* ===== QUIZ ===== */
.quiz-item {
  background: var(--bg3); border-radius: 10px; padding: 20px; margin-bottom: 16px;
  border: 1px solid var(--border);
}
.quiz-item .q-text { font-weight: 600; color: var(--text); margin-bottom: 12px; }
.quiz-options label {
  display: flex; align-items: flex-start; gap: 10px; padding: 8px 12px;
  border-radius: 6px; cursor: pointer; transition: var(--transition);
  font-size: 0.88rem; color: var(--text2); margin-bottom: 6px;
}
.quiz-options label:hover { background: rgba(255,153,0,0.08); }
.quiz-options input[type="radio"], .quiz-options input[type="checkbox"] {
  accent-color: var(--accent); flex-shrink: 0; margin-top: 2px;
}
.quiz-options label.correct { background: rgba(74,222,128,0.15); color: var(--green); }
.quiz-options label.incorrect { background: rgba(248,113,113,0.15); color: var(--red); }
.quiz-explanation {
  display: none; margin-top: 12px; padding: 12px; background: var(--bg2);
  border-radius: 8px; font-size: 0.85rem; color: var(--text2); border-left: 3px solid var(--accent);
}
.quiz-explanation.show { display: block; }
.btn {
  padding: 9px 20px; border-radius: 8px; border: none; cursor: pointer;
  font-size: 0.88rem; font-weight: 600; transition: var(--transition);
}
.btn-primary { background: var(--accent); color: #000; }
.btn-primary:hover { background: var(--accent2); }
.btn-secondary { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
.btn-green { background: var(--green); color: #000; }
.btn-red { background: var(--red); color: #fff; }
/* ===== FLASHCARDS ===== */
#flashcard-section .fc-controls {
  display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-bottom: 20px;
}
.fc-progress-bar {
  width: 100%; height: 6px; background: var(--bg3); border-radius: 3px; margin-bottom: 20px;
}
.fc-progress-fill { height: 100%; background: var(--accent); border-radius: 3px; transition: width 0.5s ease; }
.fc-stage {
  perspective: 1000px; cursor: pointer; margin: 0 auto 20px;
  width: 100%; max-width: 600px; height: 260px;
}
.fc-card {
  width: 100%; height: 100%; position: relative;
  transform-style: preserve-3d; transition: transform 0.6s ease;
}
.fc-card.flipped { transform: rotateY(180deg); }
.fc-front, .fc-back {
  position: absolute; inset: 0; backface-visibility: hidden;
  border-radius: var(--radius); display: flex; align-items: center; justify-content: center;
  padding: 28px; text-align: center; border: 2px solid var(--border);
}
.fc-front {
  background: var(--bg2);
  flex-direction: column; gap: 12px;
}
.fc-front .fc-domain {
  font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.1em;
  color: var(--accent); font-weight: 600;
}
.fc-front .fc-question { font-size: 1.05rem; font-weight: 600; color: var(--text); }
.fc-front .fc-hint { font-size: 0.78rem; color: var(--text2); }
.fc-back {
  background: linear-gradient(135deg, #1e3a2f, #0f2a1f);
  transform: rotateY(180deg); flex-direction: column; gap: 10px;
  border-color: var(--green);
}
.fc-back .fc-answer { font-size: 1.05rem; font-weight: 700; color: var(--green); }
.fc-back .fc-detail { font-size: 0.82rem; color: var(--text2); }
.fc-action-row {
  display: flex; justify-content: center; gap: 12px; margin-top: 8px;
}
.fc-counter { text-align: center; font-size: 0.85rem; color: var(--text2); margin-bottom: 8px; }
/* ===== MOCK EXAM ===== */
#mock-exam .exam-intro { text-align: center; padding: 40px 20px; }
#mock-exam .exam-intro h2 { font-size: 1.5rem; margin-bottom: 12px; }
#mock-exam .exam-intro p { color: var(--text2); margin-bottom: 20px; }
.exam-stats {
  display: flex; justify-content: center; gap: 24px; margin-bottom: 24px; flex-wrap: wrap;
}
.exam-stat { text-align: center; }
.exam-stat .val { font-size: 1.4rem; font-weight: 700; color: var(--accent); }
.exam-stat .lbl { font-size: 0.75rem; color: var(--text2); }
#exam-running { display: none; }
.exam-header {
  display: flex; justify-content: space-between; align-items: center;
  background: var(--bg3); border-radius: 10px; padding: 14px 20px; margin-bottom: 20px;
  flex-wrap: wrap; gap: 10px;
}
.exam-timer {
  font-family: 'JetBrains Mono', monospace; font-size: 1.2rem; font-weight: 700;
  color: var(--accent);
}
.exam-timer.urgent { color: var(--red); animation: pulse 1s infinite; }
@keyframes pulse { 0%,100%{opacity:1}50%{opacity:0.5} }
.exam-q-num { font-size: 0.85rem; color: var(--text2); }
.exam-progress { height: 4px; background: var(--bg3); border-radius: 2px; margin-bottom: 20px; }
.exam-progress-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width 0.3s ease; }
.exam-q-card { background: var(--bg3); border-radius: 10px; padding: 24px; }
.exam-q-text { font-size: 1rem; font-weight: 600; color: var(--text); margin-bottom: 16px; }
.exam-q-note { font-size: 0.78rem; color: var(--text2); margin-bottom: 12px; font-style: italic; }
.exam-option {
  display: flex; align-items: flex-start; gap: 10px; padding: 10px 14px;
  border-radius: 8px; cursor: pointer; transition: var(--transition);
  font-size: 0.88rem; color: var(--text2); margin-bottom: 6px;
  border: 1.5px solid var(--border); background: var(--bg2);
}
.exam-option:hover { border-color: var(--accent); color: var(--text); }
.exam-option.selected { border-color: var(--accent); background: rgba(255,153,0,0.1); color: var(--text); }
.exam-option.correct { border-color: var(--green); background: rgba(74,222,128,0.1); color: var(--green); }
.exam-option.wrong { border-color: var(--red); background: rgba(248,113,113,0.1); color: var(--red); }
.exam-nav { display: flex; justify-content: flex-end; margin-top: 16px; gap: 10px; }
#exam-results { display: none; }
.result-header { text-align: center; padding: 32px 20px; }
.result-score { font-size: 3rem; font-weight: 700; }
.result-score.pass { color: var(--green); }
.result-score.fail { color: var(--red); }
.result-badge {
  display: inline-block; padding: 6px 20px; border-radius: 20px;
  font-weight: 600; font-size: 0.9rem; margin-top: 8px;
}
.result-badge.pass { background: rgba(74,222,128,0.2); color: var(--green); }
.result-badge.fail { background: rgba(248,113,113,0.2); color: var(--red); }
.domain-breakdown {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 12px; margin: 20px 0;
}
.domain-score-card {
  background: var(--bg3); border-radius: 10px; padding: 16px; text-align: center;
}
.domain-score-card h4 { font-size: 0.78rem; color: var(--text2); margin-bottom: 8px; }
.domain-score-card .score { font-size: 1.3rem; font-weight: 700; color: var(--accent); }
.exam-review { margin-top: 24px; }
.review-item { background: var(--bg3); border-radius: 10px; padding: 16px; margin-bottom: 12px; }
.review-item .r-q { font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 8px; }
.review-item .r-correct { color: var(--green); font-size: 0.85rem; }
.review-item .r-yours { color: var(--red); font-size: 0.85rem; }
.review-item .r-explain { color: var(--text2); font-size: 0.82rem; margin-top: 8px; }
/* ===== BACK TO TOP ===== */
#back-to-top {
  position: fixed; bottom: 28px; right: 28px; width: 44px; height: 44px;
  background: var(--accent); color: #000; border: none; border-radius: 50%;
  cursor: pointer; font-size: 1.2rem; box-shadow: var(--shadow);
  opacity: 0; pointer-events: none; transition: opacity 0.3s ease, transform 0.3s ease;
  display: flex; align-items: center; justify-content: center;
}
#back-to-top.visible { opacity: 1; pointer-events: all; }
#back-to-top:hover { transform: translateY(-3px); }
/* ===== RESPONSIVE ===== */
@media (max-width: 900px) {
  .sidebar { display: none; }
  main { padding: 20px 16px; max-width: 100%; }
  .dashboard { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 480px) {
  .dashboard { grid-template-columns: 1fr 1fr; }
  header { padding: 0 12px; }
  .header-logo h1 { font-size: 0.85rem; }
}
/* ===== PRINT ===== */
@media print {
  .sidebar, header, #back-to-top, #scroll-progress,
  #flashcard-section, #mock-exam, .quiz-options input { display: none !important; }
  main { padding: 0; max-width: 100%; }
  .section { break-inside: avoid; border: 1px solid #ccc; }
  body { background: #fff; color: #000; font-size: 12px; }
  a { color: #000; }
}
</style>
</head>
<body>
<div id="scroll-progress"></div>
<!-- HEADER -->
<header>
  <div class="header-logo">
    <div class="logo-icon">AWS</div>
    <div>
      <h1>Cloud Practitioner CLF-C02</h1>
      <span>Piano di Studio Completo – Guida Totale CLF-C02</span>
    </div>
  </div>
  <div class="header-right">
    <div class="pill">Giorni: <strong id="hdr-days">0</strong>/10</div>
    <div class="pill">Quiz: <strong id="hdr-quiz">–</strong></div>
    <button class="theme-toggle" onclick="toggleTheme()" aria-label="Cambia tema">🌙 Tema</button>
  </div>
</header>

<!-- LAYOUT -->
<div class="layout">
<!-- SIDEBAR -->
<nav class="sidebar" aria-label="Navigazione sezioni">
  <input class="sidebar-search" id="sidebar-search" type="text" placeholder="🔍 Cerca sezione..." oninput="filterSidebar(this.value)" aria-label="Cerca sezione">
  <div class="sidebar-section">
    <h4>Dashboard</h4>
    <button class="nav-link" onclick="scrollTo('dashboard-section')">📊 Progressi</button>
  </div>
  <div class="sidebar-section">
    <h4>Esame</h4>
    <button class="nav-link" onclick="scrollTo('struttura')">📋 Struttura Esame</button>
  </div>
  <div class="sidebar-section">
    <h4>Piano 10 Giorni</h4>
    <button class="nav-link" data-section="g1" onclick="scrollTo('giorno1')">
      <span class="check" id="chk-g1" onclick="toggleCheck(event,'g1')"></span>
      Giorno 1 – Cloud Fondamenti
      <span class="eta">~25 min</span>
    </button>
    <button class="nav-link" data-section="g2" onclick="scrollTo('giorno2')">
      <span class="check" id="chk-g2" onclick="toggleCheck(event,'g2')"></span>
      Giorno 2 – Infrastruttura
      <span class="eta">~20 min</span>
    </button>
    <button class="nav-link" data-section="g3" onclick="scrollTo('giorno3')">
      <span class="check" id="chk-g3" onclick="toggleCheck(event,'g3')"></span>
      Giorno 3 – IAM & Identity
      <span class="eta">~30 min</span>
    </button>
    <button class="nav-link" data-section="g4" onclick="scrollTo('giorno4')">
      <span class="check" id="chk-g4" onclick="toggleCheck(event,'g4')"></span>
      Giorno 4 – Sicurezza
      <span class="eta">~35 min</span>
    </button>
    <button class="nav-link" data-section="g5" onclick="scrollTo('giorno5')">
      <span class="check" id="chk-g5" onclick="toggleCheck(event,'g5')"></span>
      Giorno 5 – Compute & Storage
      <span class="eta">~35 min</span>
    </button>
    <button class="nav-link" data-section="g6" onclick="scrollTo('giorno6')">
      <span class="check" id="chk-g6" onclick="toggleCheck(event,'g6')"></span>
      Giorno 6 – Database & Rete
      <span class="eta">~35 min</span>
    </button>
    <button class="nav-link" data-section="g7" onclick="scrollTo('giorno7')">
      <span class="check" id="chk-g7" onclick="toggleCheck(event,'g7')"></span>
      Giorno 7 – AI & Microservizi
      <span class="eta">~30 min</span>
    </button>
    <button class="nav-link" data-section="g8" onclick="scrollTo('giorno8')">
      <span class="check" id="chk-g8" onclick="toggleCheck(event,'g8')"></span>
      Giorno 8 – Billing & Costi
