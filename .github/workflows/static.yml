<!-- QUIZ TRAPPOLE -->
<div class="section" id="quiz-section">
  <h2>🪤 Quiz Trappole – 10 Domande Difficili</h2>
  <p>Queste domande coprono i punti più frequentemente sbagliati nell'esame CLF-C02. Seleziona la risposta e clicca "Verifica".</p>

  <!-- Q1 -->
  <div class="quiz-item" id="qi1">
    <div class="q-text">1. Un'azienda deve garantire che il suo database rimanga disponibile anche se un'intera Availability Zone diventa inaccessibile. Quale funzionalità di RDS dovrebbe abilitare?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q1" value="a"> A. Read Replica in un'altra AZ</label>
      <label><input type="radio" name="q1" value="b"> B. RDS Multi-AZ deployment</label>
      <label><input type="radio" name="q1" value="c"> C. RDS Enhanced Monitoring</label>
      <label><input type="radio" name="q1" value="d"> D. RDS Automated Backup con retention 7 giorni</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q1','b','qi1')">Verifica</button>
    <div class="quiz-explanation" id="exp-q1">
      <strong>✅ Risposta: B – RDS Multi-AZ</strong><br>Multi-AZ crea una replica sincrona standby in una AZ diversa con failover automatico (60-120 secondi). La Read Replica è asincrona e serve per scalare le letture, non per failover automatico.
    </div>
  </div>

  <!-- Q2 -->
  <div class="quiz-item" id="qi2">
    <div class="q-text">2. Un Security Group permette il traffico in ingresso sulla porta 443. Un NACL blocca il traffico in uscita sulla porta 443 verso la stessa subnet. Cosa succede alle connessioni HTTPS in entrata?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q2" value="a"> A. Funzionano normalmente perché il Security Group è stateful</label>
      <label><input type="radio" name="q2" value="b"> B. Vengono bloccate perché il NACL nega il traffico di risposta</label>
      <label><input type="radio" name="q2" value="c"> C. Funzionano perché HTTPS usa connessioni one-way</label>
      <label><input type="radio" name="q2" value="d"> D. Vengono reindirizzate alla porta 80</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q2','b','qi2')">Verifica</button>
    <div class="quiz-explanation" id="exp-q2">
      <strong>✅ Risposta: B – Bloccate dal NACL</strong><br>NACL è <strong>stateless</strong>: ogni pacchetto è valutato indipendentemente. Anche se la connessione in entrata è permessa, il traffico di risposta in uscita viene bloccato dal NACL. I Security Group sono stateful: tracciano lo stato della connessione e permettono automaticamente il traffico di risposta.
    </div>
  </div>

  <!-- Q3 -->
  <div class="quiz-item" id="qi3">
    <div class="q-text">3. Un team deve archiviare log di compliance legale per 7 anni. I log non verranno mai letti ma devono essere recuperabili entro 48 ore se necessario. Quale classe S3 è più economica?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q3" value="a"> A. S3 Standard</label>
      <label><input type="radio" name="q3" value="b"> B. S3 Glacier Flexible Retrieval</label>
      <label><input type="radio" name="q3" value="c"> C. S3 Glacier Deep Archive</label>
      <label><input type="radio" name="q3" value="d"> D. S3 Standard-IA</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q3','c','qi3')">Verifica</button>
    <div class="quiz-explanation" id="exp-q3">
      <strong>✅ Risposta: C – S3 Glacier Deep Archive</strong><br>È la classe S3 più economica (~$0.00099/GB/mese). Il retrieval di 12-48 ore soddisfa il requisito. Standard-IA e Glacier Flexible costano di più. Standard è la più cara per storage a lungo termine raramente acceduto.
    </div>
  </div>

  <!-- Q4 -->
  <div class="quiz-item" id="qi4">
    <div class="q-text">4. Un'applicazione EC2 deve leggere file da un bucket S3. Quale è il metodo MIGLIORE per concedere questo accesso in modo sicuro?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q4" value="a"> A. Creare un IAM User con access keys e configurarle nell'applicazione</label>
      <label><input type="radio" name="q4" value="b"> B. Assegnare un IAM Role all'istanza EC2 con la policy S3 read necessaria</label>
      <label><input type="radio" name="q4" value="c"> C. Fare il bucket S3 pubblico</label>
      <label><input type="radio" name="q4" value="d"> D. Usare le credenziali root nel codice dell'applicazione</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q4','b','qi4')">Verifica</button>
    <div class="quiz-explanation" id="exp-q4">
      <strong>✅ Risposta: B – IAM Role sull'istanza EC2</strong><br>I Role forniscono credenziali temporanee e rotanti automaticamente via Instance Metadata Service. Non bisogna mai hard-codare access keys nel codice (rischio di leak). Le credenziali root non vanno mai usate in applicazioni.
    </div>
  </div>

  <!-- Q5 -->
  <div class="quiz-item" id="qi5">
    <div class="q-text">5. Qual è la differenza principale tra AWS CloudTrail e AWS Config?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q5" value="a"> A. CloudTrail monitora le configurazioni delle risorse; Config registra le chiamate API</label>
      <label><input type="radio" name="q5" value="b"> B. CloudTrail registra le chiamate API (chi ha fatto cosa); Config traccia le configurazioni delle risorse nel tempo (come sono cambiate)</label>
      <label><input type="radio" name="q5" value="c"> C. Sono lo stesso servizio con nomi diversi</label>
      <label><input type="radio" name="q5" value="d"> D. CloudTrail è per la sicurezza, Config è solo per il costo</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q5','b','qi5')">Verifica</button>
    <div class="quiz-explanation" id="exp-q5">
      <strong>✅ Risposta: B</strong><br><strong>CloudTrail</strong> = audit trail di TUTTE le chiamate API (chi, cosa, quando, da dove). <strong>Config</strong> = stato e cronologia configurazione risorse + regole di compliance. Esempi: CloudTrail dice "chi ha terminato l'istanza EC2 alle 14:30"; Config dice "questa istanza non aveva Multi-AZ abilitato".
    </div>
  </div>

  <!-- Q6 -->
  <div class="quiz-item" id="qi6">
    <div class="q-text">6. Un'azienda con 20 account AWS vuole applicare una policy che impedisca a TUTTI gli account (incluso il management account) di disabilitare CloudTrail. Quale servizio usare?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q6" value="a"> A. IAM Permission Boundary</label>
      <label><input type="radio" name="q6" value="b"> B. AWS Config Rule</label>
      <label><input type="radio" name="q6" value="c"> C. Service Control Policy (SCP) applicata alla Root dell'Organization</label>
      <label><input type="radio" name="q6" value="d"> D. IAM Policy allegata agli utenti di ogni account</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q6','c','qi6')">Verifica</button>
    <div class="quiz-explanation" id="exp-q6">
      <strong>✅ Risposta: C – SCP sulla Root</strong><br>Le SCP di AWS Organizations applicano i permessi massimi a tutta la gerarchia. Applicata alla Root, si estende a tutti gli OU e account. Le IAM Policy operano solo all'interno di un singolo account. Config Rules rilevano la non-conformità ma non la prevengono.
    </div>
  </div>

  <!-- Q7 -->
  <div class="quiz-item" id="qi7">
    <div class="q-text">7. Un'organizzazione con 15 account AWS usa Consolidated Billing. Ha acquistato 100 Reserved Instances di tipo m5.large. Solo uno dei 15 account usa effettivamente quelle istanze. Come funziona lo sconto RI?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q7" value="a"> A. Lo sconto si applica solo all'account che ha acquistato le RI</label>
      <label><input type="radio" name="q7" value="b"> B. Lo sconto RI può essere condiviso con tutti gli account dell'Organization automaticamente</label>
      <label><input type="radio" name="q7" value="c"> C. Lo sconto si applica solo se tutti gli account usano lo stesso tipo di istanza</label>
      <label><input type="radio" name="q7" value="d"> D. Non c'è sconto perché le RI sono legate a un account specifico</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q7','b','qi7')">Verifica</button>
    <div class="quiz-explanation" id="exp-q7">
      <strong>✅ Risposta: B – Condivisione automatica</strong><br>Con Consolidated Billing, le Reserved Instances e i Savings Plans vengono condivisi automaticamente tra tutti gli account dell'Organization (se la funzione RI Sharing è abilitata, che è il default). Questo massimizza l'utilizzo degli sconti. Questo è uno dei principali vantaggi del Consolidated Billing.
    </div>
  </div>

  <!-- Q8 -->
  <div class="quiz-item" id="qi8">
    <div class="q-text">8. Un'applicazione deve elaborare 1 milione di immagini caricate su S3 ogni giorno. L'elaborazione richiede 2 minuti per immagine. Quale servizio è più appropriato?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q8" value="a"> A. AWS Lambda triggered da S3 events</label>
      <label><input type="radio" name="q8" value="b"> B. Amazon EC2 con Auto Scaling Group e SQS</label>
      <label><input type="radio" name="q8" value="c"> C. AWS Fargate con ECS e SQS</label>
      <label><input type="radio" name="q8" value="d"> D. B o C sono entrambe opzioni valide; Lambda NON è adatto</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q8','d','qi8')">Verifica</button>
    <div class="quiz-explanation" id="exp-q8">
      <strong>✅ Risposta: D – Lambda non è adatto</strong><br>Lambda ha un timeout massimo di <strong>15 minuti</strong>. 2 minuti è sotto il limite, però con 1 milione di immagini/giorno (~11.5/sec) e la natura batch del lavoro, EC2+ASG+SQS o Fargate+ECS+SQS sono più appropriati per carichi batch sostenuti. Lambda è ideale per task brevi event-driven.
    </div>
  </div>

  <!-- Q9 -->
  <div class="quiz-item" id="qi9">
    <div class="q-text">9. Quale affermazione sul modello di responsabilità condivisa per Amazon RDS è CORRETTA?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q9" value="a"> A. Il cliente è responsabile del patching del sistema operativo del database</label>
      <label><input type="radio" name="q9" value="b"> B. AWS è responsabile del patching del motore DB e del OS sottostante; il cliente gestisce i dati e la configurazione</label>
      <label><input type="radio" name="q9" value="c"> C. AWS gestisce i dati del cliente incluse le query</label>
      <label><input type="radio" name="q9" value="d"> D. Il cliente deve configurare manualmente la replica Multi-AZ dell'OS</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q9','b','qi9')">Verifica</button>
    <div class="quiz-explanation" id="exp-q9">
      <strong>✅ Risposta: B</strong><br>RDS è un servizio <strong>managed</strong>: AWS gestisce OS patching, DB engine patching, backup automatico, Multi-AZ failover hardware. Il cliente è responsabile dei dati, delle query, della configurazione dell'accesso (utenti DB, Security Groups), e della scelta delle opzioni di backup/retention.
    </div>
  </div>

  <!-- Q10 -->
  <div class="quiz-item" id="qi10">
    <div class="q-text">10. Un'azienda vuole ridurre i costi EC2 per carichi di lavoro di produzione stabili e prevedibili che girano 24/7 per i prossimi 3 anni. Quale opzione di acquisto offre il MASSIMO risparmio?</div>
    <div class="quiz-options">
      <label><input type="radio" name="q10" value="a"> A. Spot Instances</label>
      <label><input type="radio" name="q10" value="b"> B. On-Demand Instances</label>
      <label><input type="radio" name="q10" value="c"> C. Reserved Instances 3 anni, pagamento All Upfront</label>
      <label><input type="radio" name="q10" value="d"> D. Dedicated Hosts con Reserved pricing</label>
    </div>
    <button class="btn btn-primary" onclick="checkQuiz('q10','c','qi10')">Verifica</button>
    <div class="quiz-explanation" id="exp-q10">
      <strong>✅ Risposta: C – Reserved Instances 3 anni All Upfront</strong><br>Per carichi stabili 24/7 su 3 anni, RI 3yr All Upfront offre fino al <strong>72% di sconto</strong> rispetto a On-Demand. Spot non è adatto per produzione (interrompibile). Dedicated Hosts sono più costosi e servono per compliance/BYOL. Savings Plans sono flessibili ma leggermente meno convenienti delle RI per stessi tipi di istanza.
    </div>
  </div>
</div>
