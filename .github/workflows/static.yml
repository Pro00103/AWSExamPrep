    <tr><td><strong>Amazon EKS</strong></td><td>Managed Kubernetes – orchestra container con K8s</td><td>EC2 o Fargate. AWS gestisce control plane</td></tr>
    <tr><td><strong>AWS Fargate</strong></td><td>Serverless compute per container ECS/EKS</td><td>AWS gestisce tutto. Paghi solo i container</td></tr>
    <tr><td><strong>Amazon ECR</strong></td><td>Container registry (come Docker Hub ma AWS)</td><td>Fully managed. Integra con ECS/EKS</td></tr>
  </table>
  </div>

  <h3>Developer Tools</h3>
  <ul>
    <li><strong>AWS CodeCommit:</strong> Git repository privato (come GitHub ma AWS)</li>
    <li><strong>AWS CodeBuild:</strong> Build e test automatizzati (CI)</li>
    <li><strong>AWS CodeDeploy:</strong> Deploy automatizzato su EC2/Lambda/ECS (CD)</li>
    <li><strong>AWS CodePipeline:</strong> Orchestrazione CI/CD completa (commit → deploy)</li>
    <li><strong>AWS X-Ray:</strong> Tracing distribuito per debug applicazioni</li>
    <li><strong>Amazon CloudWatch:</strong> Metriche, log, allarmi, dashboard centralizzati</li>
    <li><strong>AWS CloudTrail:</strong> Audit di tutte le API calls nell'account</li>
  </ul>

  <h3>Amazon CloudWatch – Approfondimento</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Feature</th><th>Descrizione</th><th>Esempio</th></tr>
    <tr><td><strong>Metrics</strong></td><td>Dati numerici nel tempo (CPU, network, custom metrics)</td><td>EC2 CPU utilization, Lambda duration</td></tr>
    <tr><td><strong>Logs</strong></td><td>Centralizza log da EC2, Lambda, ECS, API GW</td><td>Application logs, access logs</td></tr>
    <tr><td><strong>Alarms</strong></td><td>Trigger su soglie metriche → SNS, Auto Scaling, EC2 actions</td><td>Alert se CPU &gt; 90% per 5 min</td></tr>
    <tr><td><strong>Dashboards</strong></td><td>Visualizzazioni personalizzate multi-metrica</td><td>Ops dashboard real-time</td></tr>
    <tr><td><strong>Log Insights</strong></td><td>Query SQL-like sui CloudWatch Logs</td><td>Analisi errori, pattern nei log</td></tr>
    <tr><td><strong>Container Insights</strong></td><td>Metriche/log per ECS, EKS, Kubernetes</td><td>Monitoring container in produzione</td></tr>
    <tr><td><strong>Contributor Insights</strong></td><td>Identifica top contributors in dati di log</td><td>Top IP che generano errori 5xx</td></tr>
    <tr><td><strong>Events / EventBridge</strong></td><td>Reagisce a eventi di stato AWS (es. EC2 state change)</td><td>Automation su eventi infrastruttura</td></tr>
  </table>
  </div>
  <div class="callout info"><strong>CloudWatch Agent:</strong> Installato su EC2 per raccogliere metriche custom (RAM, disco) e log applicativi. La RAM NON è monitorata di default da CloudWatch senza agent.</div>

  <h3>AWS Elastic Beanstalk</h3>
  <p>Servizio PaaS che automatizza il deploy di applicazioni web senza gestire l'infrastruttura sottostante.</p>
  <ul>
    <li>Supporta: Node.js, Python, Java, .NET, PHP, Ruby, Go, Docker</li>
    <li>Provisioning automatico: EC2, ALB, Auto Scaling, RDS</li>
    <li>Il cliente carica solo il codice; AWS gestisce tutto il resto</li>
    <li><strong>Free:</strong> Elastic Beanstalk è gratis — paghi solo le risorse create (EC2, ALB, ecc.)</li>
    <li>Ideale per sviluppatori che vogliono focus sul codice, non sull'infrastruttura</li>
  </ul>
  <div class="callout warn"><strong>Elastic Beanstalk vs Lambda:</strong> Beanstalk = applicazione tradizionale su server (long-running). Lambda = funzione event-driven (stateless, max 15 min).</div>

  <h3>AWS Marketplace</h3>
  <p>Catalogo digitale con migliaia di software di terze parti precostituiti per AWS:</p>
  <ul>
    <li>AMI preconfigurate (es. WordPress, SAP, database commerciali)</li>
    <li>Software SaaS, container, ML models</li>
    <li>Licenze BYOL (Bring Your Own License) o pay-as-you-go</li>
    <li>Fatturazione integrata nella bolletta AWS</li>
    <li>Prodotti verificati e sicuri da AWS</li>
  </ul>

  <h3>Amazon Athena &amp; AWS Glue</h3>
  <div class="table-wrap">
  <table>
    <tr><th>Servizio</th><th>Funzione</th><th>Quando usarlo</th></tr>
    <tr><td><strong>Amazon Athena</strong></td><td>Query SQL serverless direttamente su file S3 (CSV, JSON, Parquet)</td><td>Analisi log, query ad-hoc su data lake. Paghi per dati scansionati.</td></tr>
    <tr><td><strong>AWS Glue</strong></td><td>ETL serverless (Extract, Transform, Load) + Data Catalog</td><td>Preparazione dati per analytics, catalogazione metadata</td></tr>
    <tr><td><strong>Amazon QuickSight</strong></td><td>BI dashboard serverless su dati AWS</td><td>Visualizzazioni interattive per business users</td></tr>
    <tr><td><strong>Amazon OpenSearch</strong></td><td>Search e analytics su log/documenti (ex Elasticsearch)</td><td>Full-text search, analisi log real-time</td></tr>
    <tr><td><strong>AWS Lake Formation</strong></td><td>Setup e governance di data lake su S3</td><td>Centralizza accesso ai dati, fine-grained permissions</td></tr>
  </table>
  </div>
</div>
